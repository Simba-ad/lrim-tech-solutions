<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lrim-Tech Product Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,textarea,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-size:24px;font-weight:800;color:#155eef}.card{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(20,40,80,.06)}.login{max-width:460px;margin:70px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:0 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd6e4;border-radius:9px;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer;background:#155eef;color:#fff}.btn.secondary{background:#eef3ff;color:#155eef}.btn.danger{background:#fff0f0;color:#b42318}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{margin:12px 0;padding:11px 13px;border-radius:8px;background:#eef3ff;display:none}.products{margin-top:22px}.row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #edf0f5}.row img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:#eef1f5}.muted{color:#667085;font-size:14px}.image-help{font-size:12px;color:#667085;margin-top:6px}.image-preview{margin-top:10px;display:none;width:120px;height:90px;object-fit:cover;border-radius:9px;border:1px solid #e5e9f2}.upload-status{font-size:13px;color:#155eef;margin-top:7px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef3ff;color:#155eef;font-size:12px;font-weight:700;margin-right:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:58px 1fr}.row img{width:58px;height:58px}.row .actions{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div id="loginView" class="card login"><div class="brand">Lrim-Tech Solutions</div><h1>Product Admin</h1><p class="muted">Sign in with your Lrim-Tech administrator account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><br><br><label>Password</label><input id="password" type="password" required autocomplete="current-password"><br><br><button class="btn" type="submit">Sign In</button></form><div id="loginMsg" class="msg"></div></div>
<div id="adminView" hidden><div class="top"><div><div class="brand">Lrim-Tech Solutions</div><div class="muted">Product Catalogue Admin</div></div><button id="signOut" class="btn secondary">Sign Out</button></div>
<div class="card"><h2 id="formTitle">Add Product</h2><form id="productForm" class="grid"><input id="editId" type="hidden"><div><label>Product name</label><input id="name" required></div><div><label>Category</label><input id="category" placeholder="Technology" required></div><div class="full"><label>Short description</label><textarea id="short_description" required></textarea></div><div><label>Product image</label><input id="image_file" type="file" accept="image/jpeg,image/png,image/webp"><div class="image-help">JPEG, PNG or WebP. Maximum 5 MB.</div><div id="uploadStatus" class="upload-status"></div><img id="imagePreview" class="image-preview" alt="Product image preview"><input id="image_url" type="hidden"></div><div><label>Price label</label><input id="price_label" placeholder="Check Latest Price"></div><div class="full"><label>Affiliate / product URL</label><input id="affiliate_url" type="url" placeholder="https://..."></div><div><label>Sort order</label><input id="sort_order" type="number" value="0"></div><div><label><input id="featured" type="checkbox" style="width:auto"> Featured product</label><label><input id="published" type="checkbox" style="width:auto"> Published on website</label></div><div class="full actions"><button class="btn" type="submit">Save Product</button><button id="cancelEdit" class="btn secondary" type="button" hidden>Cancel Edit</button></div></form><div id="productMsg" class="msg"></div></div>
<div class="card products"><h2>Products</h2><div id="productList" class="muted">Loading products...</div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://upmyevbiplsxjizlhtwa.supabase.co';
const SUPABASE_KEY='sb_publishable_ZlZDwfWWEQbL-_7u69sU5A_50j9BaAP';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let products=[];
function showMsg(id,text,bad=false){const e=$(id);e.textContent=text;e.style.display='block';e.style.background=bad?'#fff0f0':'#eef3ff';e.style.color=bad?'#b42318':'#155eef'}
async function setView(){const {data:{session}}=await sb.auth.getSession();$('loginView').hidden=!!session;$('adminView').hidden=!session;if(session)loadProducts()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return showMsg('loginMsg',error.message,true);$('loginMsg').style.display='none';setView()};
$('signOut').onclick=async()=>{await sb.auth.signOut();setView()};
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){$('productList').textContent=error.message;return}products=data||[];renderProducts()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderProducts(){if(!products.length){$('productList').innerHTML='<p>No products yet. Add your first product above.</p>';return}$('productList').innerHTML=products.map(p=>`<div class="row"><img src="${esc(p.image_url||'')}" alt="" onerror="this.style.visibility='hidden'"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.category||'')}</div><div><span class="badge">${p.published?'Published':'Draft'}</span>${p.featured?'<span class="badge">Featured</span>':''}</div></div><div class="actions"><button class="btn secondary" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></div>`).join('')}
window.editProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;['name','category','short_description','image_url','affiliate_url','price_label','sort_order'].forEach(k=>$(k).value=p[k]??'');$('image_file').value='';$('uploadStatus').textContent=p.image_url?'Current image will be kept unless you choose a new one.':'';if(p.image_url){$('imagePreview').src=p.image_url;$('imagePreview').style.display='block'}else{$('imagePreview').style.display='none'};$('featured').checked=!!p.featured;$('published').checked=!!p.published;$('editId').value=p.id;$('formTitle').textContent='Edit Product';$('cancelEdit').hidden=false;scrollTo({top:0,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return showMsg('productMsg',error.message,true);showMsg('productMsg','Product deleted.');loadProducts()};
function resetForm(){$('productForm').reset();$('sort_order').value=0;$('editId').value='';$('image_url').value='';$('imagePreview').removeAttribute('src');$('imagePreview').style.display='none';$('uploadStatus').textContent='';$('formTitle').textContent='Add Product';$('cancelEdit').hidden=true}
$('cancelEdit').onclick=resetForm;
$('image_file').onchange=()=>{const f=$('image_file').files[0];$('uploadStatus').textContent='';if(!f){$('imagePreview').style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){showMsg('productMsg','Please choose a JPEG, PNG or WebP image.',true);$('image_file').value='';return}if(f.size>5*1024*1024){showMsg('productMsg','Image is larger than 5 MB. Please choose a smaller image.',true);$('image_file').value='';return}const u=URL.createObjectURL(f);$('imagePreview').src=u;$('imagePreview').style.display='block';$('uploadStatus').textContent='Image ready to upload.'};
function safeFileName(name){return name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'product-image'}
async function uploadProductImage(file){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Your admin session has expired. Please sign in again.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Please choose a JPEG, PNG or WebP image.');if(file.size>5*1024*1024)throw new Error('Image is larger than 5 MB.');const path=session.user.id+'/'+Date.now()+'-'+safeFileName(file.name);$('uploadStatus').textContent='Uploading image...';const {error}=await sb.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error)throw error;const {data}=sb.storage.from('product-images').getPublicUrl(path);if(!data||!data.publicUrl)throw new Error('Image uploaded but its public URL could not be created.');return data.publicUrl}
$('productForm').onsubmit=async e=>{e.preventDefault();const saveBtn=e.submitter||$('productForm').querySelector('button[type=submit]');saveBtn.disabled=true;try{let imageUrl=$('image_url').value.trim()||null;const file=$('image_file').files[0];if(file)imageUrl=await uploadProductImage(file);const row={name:$('name').value.trim(),category:$('category').value.trim(),short_description:$('short_description').value.trim(),image_url:imageUrl,affiliate_url:$('affiliate_url').value.trim()||null,price_label:$('price_label').value.trim()||null,featured:$('featured').checked,published:$('published').checked,sort_order:Number($('sort_order').value)||0};const id=$('editId').value;const q=id?sb.from('products').update(row).eq('id',id):sb.from('products').insert(row);const {error}=await q;if(error)throw error;showMsg('productMsg',id?'Product updated successfully.':'Product added successfully.');resetForm();await loadProducts()}catch(err){showMsg('productMsg',err.message||'Could not save product.',true);$('uploadStatus').textContent=''}finally{saveBtn.disabled=false}};
sb.auth.onAuthStateChange(()=>setView());setView();
</script></body></html>
